<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <table align="center" width="700" cellpadding="10">
            <tr>
                <td colspan="2" align="center">
                    <h1>Students Registration Form</h1>
                </td>
            </tr>
            <tr>
                <td>roll no. :</td>

            </tr>

                <td> Students name :</td>
                <td>
                    <input type="text" size="20" placeholder="first name"/>
                    -
                <input type="text" size="20" placeholder="last name "/></td>
                
            </tr>
            <tr>
                <td>Father's name :</td>
                <td><input type="text" size="40"/></td>
            </tr>
            <tr>
                <td>Date of Birth</td>
                <td><input type="text" size="3" placeholder="day"/>-
                <input type="text" size="3" placeholder="month"/>-
                <input type="text" size="3" placeholder="year"/>
                <i>(DD-MM-YYYY)</i></td>
            </tr>
            <tr>

                <td><input type="text"size="1" value="+91">
                <input type="text" size="35"></td>

            <tr>

            </tr>
            <tr>

                <td><input type="password" size="35"></td>
            </tr>
            <tr>
                <td>gender :</td>
                <td><input type="radio" name="gender"/>Male
                <input type="radio" name="gender"/>Female
                </td>
            </tr>           
            <tr><td>Department</td>
            <td><input type="checkbox"/>CSE
                <input type="checkbox"/>IT
                <input type="checkbox"/>ECE 
                <input type="checkbox"/>Civile

                <tr>
                    <td>Course :</td>
                    <td>
                        <select>
                            <option>B.Tech</option>
                            <option>M.Tech</option>
                            <option>BBA</option>
                            <option>MBA</option>
                            <option>BCA</option>
                            <option>MCA</option>
                        </select>
                    </td>
                </tr>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="submit">
                    <input type="reset" value="reset">
                </td>
            </tr>
            
        </table>
    </form>
